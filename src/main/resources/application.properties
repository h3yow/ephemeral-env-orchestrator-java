# ============================================================================
# 临时环境租约编排服务配置（前缀 orchestrator）
# 所有项均有确定默认值：缺失时使用下列默认；非法/矛盾值在启动期被明确拒绝。
# 时长使用 ISO-8601（PT10M=10 分钟，PT30S=30 秒，-1 表示不限）。
# ============================================================================

# 新租约默认有效期
orchestrator.default-ttl=PT10M
# 单次续租延长时长
orchestrator.renewal-extension=PT5M
# 申请可显式指定的 TTL 闭区间
orchestrator.min-ttl=PT1M
orchestrator.max-ttl=PT1H

# 所有者 / 团队同时持有的活跃租约上限（-1 不限，0 非法）
orchestrator.owner-quota=5
orchestrator.team-quota=20

# 供给最大尝试次数（含首次）；达到后 FAILED 为终态并释放配额
orchestrator.max-provision-attempts=3
# 模拟资源池容量（资源不足判定依据）
orchestrator.resource-pool-capacity=10

# 过期回收扫描固定延迟
orchestrator.reaper-interval=PT30S

# 测试日志中可清晰看到每次操作的输入与判定依据（服务层统一 INFO/WARN）
logging.level.com.github.h3yow.ephemeralenvorchestratorjava=INFO
