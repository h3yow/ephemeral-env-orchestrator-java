# ============================================================
# 临时环境租约编排服务配置
# 缺失即使用代码内确定的默认值；非法值（<=0）会在启动时被明确拒绝。
# ============================================================

# 未显式声明时，每个所有者 / 团队的默认配额
orchestrator.defaults.owner-quota=${ORCH_OWNER_QUOTA:3}
orchestrator.defaults.team-quota=${ORCH_TEAM_QUOTA:8}

# 租约时长与每次续租时长（秒）
orchestrator.lease.ttl-seconds=${ORCH_LEASE_TTL_SECONDS:300}
orchestrator.lease.extend-seconds=${ORCH_LEASE_EXTEND_SECONDS:300}

# 供给最大尝试次数（达到上限后失败为终态，不得静默视为成功）
orchestrator.provision.max-attempts=${ORCH_PROVISION_MAX_ATTEMPTS:3}

# 本地模拟资源池总量
orchestrator.resources.pool-size=${ORCH_RESOURCE_POOL_SIZE:20}

# 后台到期扫描固定延迟（毫秒，必须为正）
orchestrator.sweep.fixed-delay-ms=${ORCH_SWEEP_FIXED_DELAY_MS:60000}
